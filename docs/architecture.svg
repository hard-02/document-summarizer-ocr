<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e24aa"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="460" fill="#fafbfc"/>
  <text x="20" y="30" font-size="19" font-weight="700" fill="#263238">Multilingual Document &amp; Image Summarizer — Architecture</text>

  <!-- ================= Inference flow ================= -->
  <rect x="20" y="70" width="150" height="66" rx="10" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="95" y="98" font-size="14" font-weight="600" text-anchor="middle" fill="#0d47a1">Document</text>
  <text x="95" y="117" font-size="11" text-anchor="middle" fill="#1565c0">.txt · .pdf · .docx</text>

  <rect x="20" y="176" width="150" height="66" rx="10" fill="#e3f2fd" stroke="#1e88e5"/>
  <text x="95" y="204" font-size="14" font-weight="600" text-anchor="middle" fill="#0d47a1">Image</text>
  <text x="95" y="223" font-size="11" text-anchor="middle" fill="#1565c0">.png · .jpg</text>

  <rect x="240" y="123" width="150" height="66" rx="10" fill="#fff3e0" stroke="#fb8c00"/>
  <text x="315" y="148" font-size="13" font-weight="600" text-anchor="middle" fill="#e65100">Extract / OCR</text>
  <text x="315" y="167" font-size="11" text-anchor="middle" fill="#ef6c00">PyMuPDF · EasyOCR</text>

  <rect x="450" y="123" width="180" height="66" rx="10" fill="#e8f5e9" stroke="#43a047"/>
  <text x="540" y="146" font-size="13" font-weight="600" text-anchor="middle" fill="#1b5e20">Summarizer</text>
  <text x="540" y="163" font-size="11" text-anchor="middle" fill="#2e7d32">en: BART · hi/mr: IndicBART</text>
  <text x="540" y="178" font-size="10" text-anchor="middle" fill="#66bb6a">(prefers models/&lt;lang&gt;)</text>

  <rect x="700" y="123" width="160" height="66" rx="10" fill="#f3e5f5" stroke="#8e24aa"/>
  <text x="780" y="151" font-size="14" font-weight="600" text-anchor="middle" fill="#4a148c">Summary</text>
  <text x="780" y="170" font-size="11" text-anchor="middle" fill="#7b1fa2">English / हिन्दी / मराठी</text>

  <line x1="170" y1="103" x2="236" y2="147" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="209" x2="236" y2="165" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="156" x2="446" y2="156" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="156" x2="696" y2="156" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= Training flow ================= -->
  <text x="20" y="285" font-size="14" font-weight="700" fill="#455a64">Training (Kaggle GPU / local)</text>

  <rect x="20" y="306" width="170" height="66" rx="10" fill="#fce4ec" stroke="#d81b60"/>
  <text x="105" y="333" font-size="13" font-weight="600" text-anchor="middle" fill="#880e4f">Dataset</text>
  <text x="105" y="352" font-size="11" text-anchor="middle" fill="#ad1457">CNN·DailyMail · XL-Sum</text>

  <rect x="250" y="306" width="190" height="66" rx="10" fill="#eceff1" stroke="#607d8b"/>
  <text x="345" y="333" font-size="13" font-weight="600" text-anchor="middle" fill="#263238">Fine-tune (GPU)</text>
  <text x="345" y="352" font-size="11" text-anchor="middle" fill="#455a64">BART / IndicBART · ROUGE</text>

  <rect x="500" y="306" width="160" height="66" rx="10" fill="#eceff1" stroke="#607d8b"/>
  <text x="580" y="333" font-size="13" font-weight="600" text-anchor="middle" fill="#263238">models/</text>
  <text x="580" y="352" font-size="11" text-anchor="middle" fill="#455a64">fine-tuned weights</text>

  <line x1="190" y1="339" x2="246" y2="339" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="339" x2="496" y2="339" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- dashed feed from models/ up to Summarizer -->
  <path d="M 580 306 C 580 240 560 210 548 193" fill="none" stroke="#8e24aa" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-dash)"/>
  <text x="596" y="255" font-size="10" fill="#8e24aa">loads</text>

  <!-- ================= Frontends ================= -->
  <rect x="20" y="400" width="840" height="42" rx="10" fill="#e8eaf6" stroke="#5c6bc0"/>
  <text x="440" y="418" font-size="12" text-anchor="middle" fill="#283593">
    Users → Web app (web/ · FastAPI + HTML/CSS/JS)  and  Streamlit demo (app.py) — both call the same src/ modules
  </text>
  <text x="440" y="434" font-size="10" text-anchor="middle" fill="#5c6bc0">Language: English · Hindi · Marathi &nbsp;|&nbsp; OCR: English + Hindi + Marathi</text>
</svg>
